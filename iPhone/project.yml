# App iPhone « Groom Pix Piste » + son widget d'écran verrouillé (Live Activity, Dynamic Island).
# Projet Xcode fabriqué par XcodeGen : `xcodegen` dans ce dossier (voir scripts/construire-iphone.sh).
# Le projet .xcodeproj n'est pas gardé dans le dépôt : il est refait à chaque construction.
name: GroomPixPiste
options:
  bundleIdPrefix: fr.hmtimings
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
packages:
  TriPhoto:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6LM4CP9824
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "5"
targets:
  GroomPixPiste:
    type: application
    platform: iOS
    sources:
      - path: Piste
        excludes: ["Polices/OFL.txt"]
      - Partage
    dependencies:
      - target: GroomPixWidget
      - package: TriPhoto
        product: TriPhotoCommun
    settings:
      base:
        PRODUCT_NAME: "Groom Pix Piste"
        PRODUCT_BUNDLE_IDENTIFIER: fr.hmtimings.piste
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Piste/Info.plist
      properties:
        CFBundleDisplayName: Groom Pix Piste
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocalNetworkUsageDescription: "L'app Piste trouve le Mac Groom Pix sur le wifi du concours."
        NSBonjourServices: [_triphoto._tcp]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Piste/Piste.entitlements
      properties:
        aps-environment: development
  GroomPixWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Partage
    dependencies:
      - package: TriPhoto
        product: TriPhotoCommun
    settings:
      base:
        PRODUCT_NAME: GroomPixWidget
        PRODUCT_BUNDLE_IDENTIFIER: fr.hmtimings.piste.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Groom Pix Piste
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  GroomPixPiste:
    build:
      targets:
        GroomPixPiste: all
        GroomPixWidget: all
